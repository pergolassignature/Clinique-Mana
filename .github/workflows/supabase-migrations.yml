name: Apply Supabase migrations (staging)

# Merging to main = deploying migrations to staging (plan Task 1.22, CLAUDE.md §11).
# Never apply migrations by hand through the Supabase MCP or the dashboard: it
# breaks the migration history this job relies on. supabase/seed.sql is LOCAL ONLY
# and `db push` never runs it.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-staging
  cancel-in-progress: false

jobs:
  apply:
    name: Push migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: vnmbjbdsjxmpijyjmmkh
      # Session pooler host of the staging project (IPv4; GitHub runners cannot reach the IPv6-only
      # direct host). Taken from the CLI's own link of this project (`supabase/.temp/pooler-url`);
      # to confirm in Dashboard → Connect → « Session pooler ». The optional repository secret
      # SUPABASE_DB_POOLER_URL overrides it (docs/plans/2026-10-07-status.md, Phase 4 Mise en service).
      SUPABASE_DB_POOLER_HOST: aws-1-ca-central-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are required."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        # --include-all: a PR merged later may carry an older timestamp than one already applied.
        run: supabase db push --linked --include-all

      - name: Verify no drift
        run: |
          unapplied=$(supabase migration list --linked 2>/dev/null | grep -cE "^\s+[0-9]{14}\s*\|\s*\|" || true)
          if [ "$unapplied" -gt 0 ]; then
            echo "::error::$unapplied migration(s) remain unapplied after push."
            exit 1
          fi
          echo "All migrations applied."

      - name: PII key health check
        # ADR 0004 « Before Phase 4 »: every canary row of private.pii_canary must decrypt with its
        # Vault key (public.pii_health_check() prints `t`), or the job fails. The check is read-only
        # and runs after the push and the drift check, so it can never stop a push halfway: a red
        # job here means the migrations ARE applied but encrypted data may be unreadable. Follow
        # docs/runbooks/pii-key-escrow.md (« La vérification du déploiement échoue ») before anyone
        # enters a SIN or bank number. Nothing is echoed: the password stays in PGPASSWORD (a
        # masked secret) and psql reads the connection from the environment.
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          fi

          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGSSLMODE=require PGCONNECT_TIMEOUT=20 \
            PGAPPNAME=deploy-pii-health-check
          conn=()
          if [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            # The secret is masked as a whole; mask its password part too, in case libpq quotes a
            # fragment of a malformed URL. The URL may omit the password (PGPASSWORD supplies it).
            case "$SUPABASE_DB_POOLER_URL" in
              *://*:*@*)
                password="${SUPABASE_DB_POOLER_URL#*://}"
                password="${password%%@*}"
                password="${password#*:}"
                if [ -n "$password" ]; then echo "::add-mask::$password"; fi
                unset password
                ;;
            esac
            conn=(--dbname="$SUPABASE_DB_POOLER_URL")
          else
            export PGHOST="$SUPABASE_DB_POOLER_HOST" PGPORT=5432 PGDATABASE=postgres \
              PGUSER="postgres.$SUPABASE_PROJECT_ID"
            # Cross-check with the host `supabase link` resolved for this project, when it wrote one.
            linked=$(sed -E 's#^[a-z]+://[^@/]*@([^:/]+).*#\1#' supabase/.temp/pooler-url 2>/dev/null || true)
            if [ -n "$linked" ] && [ "$linked" != "$PGHOST" ]; then
              echo "::warning title=PII key health check::supabase link resolved the pooler host $linked, but SUPABASE_DB_POOLER_HOST is $PGHOST. Update the workflow env."
            fi
          fi

          fail() {
            echo "::error title=PII key health check::$1 Migrations are applied; do not enter any SIN or bank number on staging until this is fixed (docs/runbooks/pii-key-escrow.md)."
            echo "### PII key health check failed" >> "$GITHUB_STEP_SUMMARY"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if ! result=$(psql "${conn[@]}" --no-psqlrc --quiet --tuples-only --no-align \
                          --set ON_ERROR_STOP=1 --command 'select public.pii_health_check()'); then
            fail "Could not run public.pii_health_check() on staging (connection or SQL error above)."
          fi
          if [ "$result" != "t" ]; then
            fail "public.pii_health_check() returned '$result', expected 't': a canary does not decrypt with its Vault key."
          fi
          echo "PII key health check passed."
          echo "### PII key health check passed" >> "$GITHUB_STEP_SUMMARY"
