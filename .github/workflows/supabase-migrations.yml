name: Apply Supabase migrations (staging)

# Merging to main = deploying migrations to staging (plan Task 1.22, CLAUDE.md §11).
# Never apply migrations by hand through the Supabase MCP or the dashboard: it
# breaks the migration history this job relies on. supabase/seed.sql is LOCAL ONLY
# and `db push` never runs it.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-staging
  cancel-in-progress: false

jobs:
  apply:
    name: Push migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: vnmbjbdsjxmpijyjmmkh
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are required."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        # --include-all: a PR merged later may carry an older timestamp than one already applied.
        run: supabase db push --linked --include-all

      - name: Verify no drift
        run: |
          unapplied=$(supabase migration list --linked 2>/dev/null | grep -cE "^\s+[0-9]{14}\s*\|\s*\|" || true)
          if [ "$unapplied" -gt 0 ]; then
            echo "::error::$unapplied migration(s) remain unapplied after push."
            exit 1
          fi
          echo "All migrations applied."
