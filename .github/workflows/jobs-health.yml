name: Scheduled jobs health check (production)

# P3-36 (docs/plans/2026-10-07-decisions-log.md): an external watchdog for the scheduled jobs. It
# runs outside the database, so it still speaks when pg_cron itself is dead (on 2026-10-10 the
# launcher had been stale since a reset and nothing ran; then every function job failed hourly
# with `configuration_missing`, and nobody was warned). Every hour it runs
# scripts/jobs-health-check.sh, which reads public.jobs_health_report() (read-only) and turns this
# run red when nothing ran in the last hour, pg_cron recorded nothing, a job's last 3 runs failed,
# a job has not succeeded for 2.5 times its period (26 h for a daily job), a job has no cron entry,
# or `configuration_missing` appeared in the last 2 hours. A red run: docs/modules/core.md,
# « Jobs health ».
# It never pushes migrations and never writes. GitHub runs schedules from the default branch only,
# may start them late at busy times, pauses them after 60 days without activity in a public
# repository, and mails a failed scheduled run to whoever last edited the cron line
# (docs/plans/2026-10-07-status.md, Mise en service). The in-app notice for a job that keeps
# failing (P3-37) is core.scheduled_jobs_reconcile's.

on:
  schedule:
    - cron: '23 * * * *' # every hour at :23 UTC (off the top of the hour, when GitHub is busiest)
  workflow_dispatch:

permissions:
  contents: read

# Its own group: sharing supabase-migrations-staging would let a queued check cancel a queued push.
concurrency:
  group: jobs-health-production
  cancel-in-progress: false

jobs:
  check:
    name: Scheduled jobs health on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: vnmbjbdsjxmpijyjmmkh
    steps:
      - uses: actions/checkout@v4

      # TODO(pin): same as supabase-migrations.yml (no SHA recorded in the repo yet).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Check secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are required."
            exit 1
          fi

      # Like supabase-migrations.yml: `db query --linked` reads the project from the link.
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Scheduled jobs health check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/jobs-health-check.sh
