name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:supabase
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:55321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  functions:
    name: Edge function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --config: resolve npm:/jsr: imports from supabase/functions (its own
      # deno.json + deno.lock), not from the web app's package.json/node_modules.
      - run: deno check --config supabase/functions/deno.json supabase/functions/_shared/*.ts
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/_shared

  database:
    name: Migrations, RLS tests, types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      # Applies every migration, then supabase/seed.sql (local-only data).
      # Excluded containers are not needed for pgTAP or type generation
      # (names from `supabase start --help` for CLI 2.98.2).
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime
      - run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/core/supabase/database.types.ts /tmp/database.types.ts || {
            echo "::error::src/core/supabase/database.types.ts is stale. Run 'npm run db:types' and commit."
            exit 1
          }
