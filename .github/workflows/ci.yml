name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:supabase
      - run: npm run test:run
      # Typecheck already ran above: vite build only.
      - run: npm run build:only
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:55321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      # The login page's JS holds no signed-in code (npm run build runs it too).
      - run: npm run check:entry

  functions:
    name: Edge function checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      # Every function, not just _shared. The scripts pass --config
      # supabase/functions/deno.json (import map + deno.lock, not the web app's
      # node_modules) and --frozen (fail if deno.lock is out of date).
      - run: npm run check:functions
      - run: npm run lint:functions
      - run: npm run test:functions
      # supabase/templates/*.html are generated from _shared/email (P3-27):
      # fails when a committed template differs from the build output.
      - run: npm run check:auth-templates

  database:
    name: Migrations, RLS tests, types drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      # Applies every migration, then supabase/seed.sql (local-only data).
      # Excluded containers are not needed for pgTAP or type generation
      # (names from `supabase start --help` for CLI 2.98.2).
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,realtime
      - run: supabase test db
      # Again on the migrations alone: staging has no seed, and no test may lean on it.
      - name: pgTAP without the seed
        run: |
          supabase db reset --no-seed
          supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/core/supabase/database.types.ts /tmp/database.types.ts || {
            echo "::error::src/core/supabase/database.types.ts is stale. Run 'npm run db:types' and commit."
            exit 1
          }

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: npm ci
      # Every migration, then supabase/seed.sql: the specs sign in with its local logins.
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,realtime
      - name: Point the app at the local stack
        run: |
          supabase status -o env \
            | sed -n -e 's/^API_URL=/VITE_SUPABASE_URL=/p' -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/p' > .env.local
          grep -q '^VITE_SUPABASE_URL=' .env.local && grep -q '^VITE_SUPABASE_ANON_KEY=' .env.local
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
