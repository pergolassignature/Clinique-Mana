# Supabase Local Development Configuration
# Foundation rebuild — see docs/plans/2026-10-06-foundation-rebuild-design.md
# See: https://supabase.com/docs/guides/cli/config

project_id = "clinique-mana"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# One local origin: Vite listens on localhost ([::1]) only, and 127.0.0.1 would be a separate
# origin with its own session storage. Changing these needs `supabase stop && supabase start`.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
# In the CLI this key toggles the whole email provider (GOTRUE_EXTERNAL_EMAIL_ENABLED):
# false disables password and magic-link LOGIN too. Sign-ups stay closed through
# `[auth] enable_signup = false` (GOTRUE_DISABLE_SIGNUP); accounts come from invitations.
enable_signup = true
# Sends a confirmation email to both the old and the new address on an email change.
# Locally (autoconfirm on) ONE link completes the change: the new-address link alone (Task 1.21),
# and the old-address link alone (Task 3.16, through /connexion/confirmer); the other link is then
# refused. Two-address enforcement is NOT proven here and must be verified on staging.
# Keep the same value on staging/production.
double_confirm_changes = true
secure_password_change = true
enable_confirmations = false

# Auth email templates, in French with the clinic's identity (supabase/templates/).
# All but invite.html are GENERATED from supabase/functions/_shared/email/auth-templates.ts
# (npm run build:auth-templates; CI checks they match). Edit the source, not the HTML.
# The subjects below must equal AUTH_SUBJECTS there (the build checks it).
# Staging/production: paste the same subject + HTML in Dashboard → Authentication → Emails
# → Templates (config.toml is not pushed to remote projects). Keep both in sync.
[auth.email.template.recovery]
subject = "Choisissez un nouveau mot de passe · Clinique MANA"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion · Clinique MANA"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Votre accès à l'espace Clinique MANA"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirmez votre adresse courriel · Clinique MANA"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirmez le changement d'adresse courriel · Clinique MANA"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Votre code de vérification · Clinique MANA"
content_path = "./supabase/templates/reauthentication.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

# Seed file for local development
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[analytics]
enabled = false

# Edge functions. `verify_jwt = false` only for functions that authenticate themselves
# (verifyAuth, a webhook signature or X-Job-Signature; CLAUDE.md §7).
[functions.email-preview]
verify_jwt = false
[functions.email-test-send]
verify_jwt = false
[functions.resend-webhook]
verify_jwt = false
# Public token functions: no user and no gateway check; the token in the body authorizes, after
# the per-IP rate limit, and the link's module gate applies (CLAUDE.md §7). Neither reads the
# Authorization or apikey header, so they work whatever kind of public key the app sends.
[functions.resolve-link]
verify_jwt = false
[functions.accept-invite]
verify_jwt = false
[functions.staff-invite]
verify_jwt = false
[functions.users-set-status]
verify_jwt = false
[functions.storage-upload]
verify_jwt = false
[functions.storage-confirm]
verify_jwt = false
[functions.storage-sign]
verify_jwt = false
# A job: runJob verifies X-Job-Signature.
[functions.storage-cleanup]
verify_jwt = false
# Documenso webhook: the org's secret, compared with timingSafeEqual.
[functions.signing-webhook]
verify_jwt = false
# « Synchroniser » (verifyAuth) and the job core.signing_reconcile (X-Job-Signature).
[functions.signing-sync]
verify_jwt = false
[functions.signing-test-connection]
verify_jwt = false
[functions.signing-test-document]
verify_jwt = false
# Address suggestions (Google Places, P4-220): verifyAuth, any active profile.
[functions.places]
verify_jwt = false
# Professionnels (Task 4b.2): two user functions (verifyAuth with the module and the permission)
# and a job (runJob verifies X-Job-Signature).
[functions.professionals-invite]
verify_jwt = false
[functions.professionals-submit]
verify_jwt = false
[functions.professionals-invitation-reminders]
verify_jwt = false
# Job professionals.insurance_expiry_notice (runJob verifies X-Job-Signature).
[functions.professionals-insurance-expiry]
verify_jwt = false
# « Fiche PDF » → « Envoyer par courriel » (verifyAuth, module professionals).
[functions.professionals-fiche]
verify_jwt = false
# « Activer », « Réactiver », « Désactiver » and the sign-in ban that follows the provider's account
# (Task 4b.6; verifyAuth, module professionals, professionals.manage).
[functions.professionals-set-status]
verify_jwt = false
# « Refuser » a document, then the professional's email (Task 4c.3; verifyAuth, professionals.documents.review).
[functions.professionals-documents]
verify_jwt = false

# The service contract and the image consent: « Préparer et envoyer », « Renvoyer », « Régénérer »
# (Task 4d.2, P4-484; verifyAuth, module professionals; the contract needs professionals.contracts.send
# and professionals.compensation, the image consent professionals.manage). Renders.
[functions.professionals-contract-send]
verify_jwt = false

# The professional signs her own image consent in the app (P4-487, P4-488; verifyAuth, module
# professionals, professionals.self): returns her signing token once, and syncs on her return. Renders.
[functions.professionals-consent-sign]
verify_jwt = false
