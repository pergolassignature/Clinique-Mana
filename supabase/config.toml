# Supabase Local Development Configuration
# Foundation rebuild — see docs/plans/2026-10-06-foundation-rebuild-design.md
# See: https://supabase.com/docs/guides/cli/config

project_id = "clinique-mana"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# One local origin: Vite listens on localhost ([::1]) only, and 127.0.0.1 would be a separate
# origin with its own session storage. Changing these needs `supabase stop && supabase start`.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
# In the CLI this key toggles the whole email provider (GOTRUE_EXTERNAL_EMAIL_ENABLED):
# false disables password and magic-link LOGIN too. Sign-ups stay closed through
# `[auth] enable_signup = false` (GOTRUE_DISABLE_SIGNUP); accounts come from invitations.
enable_signup = true
# Sends a confirmation email to both the old and the new address on an email change.
# Locally (autoconfirm on) the new-address link alone completed the change: two-address
# enforcement is NOT proven here and must be verified on staging (plan Task 1.21).
# Keep the same value on staging/production.
double_confirm_changes = true
secure_password_change = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Seed file for local development
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[analytics]
enabled = false
