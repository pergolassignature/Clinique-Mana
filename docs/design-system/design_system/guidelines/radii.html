<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,.04)}.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-secondary);display:flex;justify-content:space-between;gap:4px}.lbl b{font-weight:500;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="align-items:flex-end"><div class="sw"><div style="height:64px;background:var(--surface-card);border:1.5px solid var(--ink);border-radius:var(--radius-sm)"></div><div class="lbl"><b>sm</b><span class="mono">4px</span></div></div><div class="sw"><div style="height:64px;background:var(--surface-card);border:1.5px solid var(--ink);border-radius:var(--radius-md)"></div><div class="lbl"><b>md</b><span class="mono">6px</span></div></div><div class="sw"><div style="height:64px;background:var(--surface-card);border:1.5px solid var(--ink);border-radius:var(--radius-lg)"></div><div class="lbl"><b>lg</b><span class="mono">12px</span></div></div><div class="sw"><div style="height:64px;background:var(--surface-card);border:1.5px solid var(--ink);border-radius:var(--radius-xl)"></div><div class="lbl"><b>xl</b><span class="mono">14px</span></div></div><div class="sw"><div style="height:64px;background:var(--surface-card);border:1.5px solid var(--ink);border-radius:var(--radius-2xl)"></div><div class="lbl"><b>2xl</b><span class="mono">16px</span></div></div><div class="sw"><div style="height:64px;background:var(--surface-card);border:1.5px solid var(--ink);border-radius:var(--radius-full)"></div><div class="lbl"><b>full</b><span class="mono">9999px</span></div></div></div><div class="mono" style="margin-top:10px">button/input/nav md · panel/menu lg · dialog 2xl · badge sm · avatar/switch full</div></body></html>
