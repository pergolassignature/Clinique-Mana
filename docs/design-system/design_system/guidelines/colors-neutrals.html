<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,.04)}.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-secondary);display:flex;justify-content:space-between;gap:4px}.lbl b{font-weight:500;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--gray-0)"></div><div class="lbl"><b>0</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="lbl"><b>50</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="lbl"><b>100</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="lbl"><b>200</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="lbl"><b>300</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="lbl"><b>400</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="lbl"><b>500</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-600)"></div><div class="lbl"><b>600</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="lbl"><b>700</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-800)"></div><div class="lbl"><b>800</b></div></div><div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="lbl"><b>900</b></div></div></div><p style="margin:14px 0 0;font:var(--type-caption);color:var(--text-muted)">Ink text 900 (#1F1F20) · secondary 600 · muted 500 · hairline 200 · panels 100 · page 0. Ink also serves as the emphasis button and active tab underline.</p></body></html>
