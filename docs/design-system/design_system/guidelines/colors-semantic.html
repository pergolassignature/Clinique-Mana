<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,.04)}.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-secondary);display:flex;justify-content:space-between;gap:4px}.lbl b{font-weight:500;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success-soft);color:var(--success-fg);display:flex;align-items:center;justify-content:center;gap:8px;font:var(--type-label)"><span style="width:8px;height:8px;border-radius:50%;background:var(--success)"></span>Succès</div><div class="lbl"><span class="mono">--success-soft</span><span class="mono">--success-fg</span></div></div><div class="sw"><div class="chip" style="background:var(--warning-soft);color:var(--warning-fg);display:flex;align-items:center;justify-content:center;gap:8px;font:var(--type-label)"><span style="width:8px;height:8px;border-radius:50%;background:var(--warning)"></span>Avertissement</div><div class="lbl"><span class="mono">--warning-soft</span><span class="mono">--warning-fg</span></div></div><div class="sw"><div class="chip" style="background:var(--danger-soft);color:var(--danger-fg);display:flex;align-items:center;justify-content:center;gap:8px;font:var(--type-label)"><span style="width:8px;height:8px;border-radius:50%;background:var(--danger)"></span>Erreur</div><div class="lbl"><span class="mono">--danger-soft</span><span class="mono">--danger-fg</span></div></div><div class="sw"><div class="chip" style="background:var(--info-soft);color:var(--info-fg);display:flex;align-items:center;justify-content:center;gap:8px;font:var(--type-label)"><span style="width:8px;height:8px;border-radius:50%;background:var(--info)"></span>Info</div><div class="lbl"><span class="mono">--info-soft</span><span class="mono">--info-fg</span></div></div><div class="sw"><div class="chip" style="background:var(--neutral-soft);color:var(--neutral-fg);display:flex;align-items:center;justify-content:center;gap:8px;font:var(--type-label)"><span style="width:8px;height:8px;border-radius:50%;background:var(--gray-400)"></span>Neutre</div><div class="lbl"><span class="mono">--neutral-soft</span><span class="mono">--neutral-fg</span></div></div></div><div class="row" style="margin-top:12px"><div class="sw"><div class="chip" style="background:var(--pink-200)"></div><div class="lbl"><b>pink-200</b><span class="mono">--pink-200</span></div></div><div class="sw"><div class="chip" style="background:var(--yellow-200)"></div><div class="lbl"><b>yellow-200</b><span class="mono">--yellow-200</span></div></div><div class="sw"><div class="chip" style="background:var(--yellow-500)"></div><div class="lbl"><b>yellow-500</b><span class="mono">--yellow-500</span></div></div><div class="sw"></div><div class="sw"></div></div></body></html>
