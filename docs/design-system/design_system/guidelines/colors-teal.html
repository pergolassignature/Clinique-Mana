<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;background:var(--bg)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,.04)}.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-secondary);display:flex;justify-content:space-between;gap:4px}.lbl b{font-weight:500;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--teal-50)"></div><div class="lbl"><b>50</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-100)"></div><div class="lbl"><b>100</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-200)"></div><div class="lbl"><b>200</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-300)"></div><div class="lbl"><b>300</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-400)"></div><div class="lbl"><b>400</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-500)"></div><div class="lbl"><b>500</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="lbl"><b>600</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-700)"></div><div class="lbl"><b>700</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-800)"></div><div class="lbl"><b>800</b></div></div><div class="sw"><div class="chip" style="background:var(--teal-900)"></div><div class="lbl"><b>900</b></div></div></div><div class="row" style="margin-top:12px"><div class="sw"><div class="chip" style="background:var(--mint-50)"></div><div class="lbl"><b>mint-50</b><span class="mono">--mint-50</span></div></div><div class="sw"><div class="chip" style="background:var(--mint-100)"></div><div class="lbl"><b>mint-100</b><span class="mono">--mint-100</span></div></div><div class="sw"><div class="chip" style="background:var(--mint-200)"></div><div class="lbl"><b>mint-200</b><span class="mono">--mint-200</span></div></div><div class="sw"><div class="chip" style="background:var(--mint-300)"></div><div class="lbl"><b>mint-300</b><span class="mono">--mint-300</span></div></div></div></body></html>
