<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinique MANA — Application</title><link rel="stylesheet" href="../design_system/styles.css"><style>html,body,#root{height:100%}*{box-sizing:border-box}body{overflow:hidden}.kit-row{display:flex;align-items:center;gap:8px}.kit-col{display:flex;flex-direction:column;gap:4px}.kit-tr{display:grid;align-items:center;gap:12px;padding:var(--row-py) var(--row-px);font:var(--type-body);color:var(--text-body);transition:background var(--dur-fast) var(--ease);min-height:40px;box-sizing:border-box}.kit-tr:hover{background:var(--surface-panel-hover)}.kit-th{display:grid;gap:12px;padding:8px var(--row-px);font:var(--type-overline);color:var(--text-muted);text-transform:uppercase;letter-spacing:var(--tracking-wide)}.kit-fig{border:0}.kit-fig+.kit-fig{border-left:1px solid var(--border)}.kit-fig:hover{background:var(--surface-panel-hover)}.kit-sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.kit-sec h3{margin:0;font:var(--type-card-title)}.kit-h4{margin:0 0 8px;font:var(--type-card-title)}.kit-tfoot{display:flex;align-items:center;justify-content:space-between;padding:8px var(--row-px);border-top:1px solid var(--border);font:var(--type-caption);color:var(--text-muted)}.kit-tr.is-selected{background:var(--primary-soft)}.kit-tr.is-selected:hover{background:var(--primary-soft)}.kit-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,38%);gap:16px;align-items:start}.kit-nowrap{white-space:nowrap}.kit-ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kit-panel{position:sticky;top:0;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface-card);display:flex;flex-direction:column;max-height:calc(100vh - var(--topbar-h) - 48px);overflow:hidden}.kit-panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}.kit-panel-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px}.kit-panel-f{display:flex;justify-content:flex-end;gap:6px;padding:10px 16px;border-top:1px solid var(--border)}.kit-muted{color:var(--text-muted)}.kit-num{font-variant-numeric:tabular-nums}@media (max-width:1100px){.kit-split{grid-template-columns:1fr}.kit-panel{position:static;max-height:none}.kit-hide-narrow{display:none}}</style>
